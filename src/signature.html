<!-- SIGNATURE TEMPLATE. The logo uses the URL derived from src/CNAME. The
     markers filled in by build.py (format: file.path.field, without the
     underscores here so the build does not confuse them) are read from
     content/signature.yml and content/common.yml (Pages CMS); .pages.yml
     declares the field types. The phone link uses the derived key
     common.contact.phone_tel, which build.py computes from common.yml. -->
<table cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; line-height: 1.5;">
  <tr>
    <td style="padding: 10px; vertical-align: middle; text-align: center; background-color: #78A2D2; width: fit-content;">
      <img src="__clinic_info.site.logo__" alt="NeuroGarval" width="150px" style="display: block;">
    </td>

    <td style="padding-left: 20px; padding-bottom: 10px; vertical-align: middle;" width="100%">
      <div style="font-size: 18px; font-weight: bold; color: #29335C;">
        __signature.name__
      </div>
      <div style="font-size: 16px; color: #333333;">__signature.license__</div>
      <div style="font-size: 14px; color: #29335C; font-weight: 600; margin-bottom: 5px;">
        __signature.role__
      </div>

      <div style="font-size: 13px; color: #666666;">
        <a href="__common.contact.phone_tel__" style="color: #666666; text-decoration: none;">__common.contact.phone__</a> |
        <a href="__signature.web_url__" style="color: #666666; text-decoration: none;">__signature.web_label__</a><br>
        <a href="__common.contact.maps_url__" style="color: #666666; text-decoration: none;">__common.contact.address_lines__</a>
      </div>
    </td>
  </tr>

  <tr>
    <td colspan="2" style="padding-top: 20px; font-size: 10px; color: #999999; line-height: 1.2; text-align: justify;">
        __signature.legal_notice__<br><br>
        __signature.data_protection__
    </td>
  </tr>
</table>
