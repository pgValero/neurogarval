<!-- PLANTILLA DE LA FIRMA. El logo y su URL son fijos. Las regiones
     pages:begin/pages:end se regeneran desde content/firma.yml y
     content/settings.yml (Pages CMS) con build.py. Los textos que regenera
     build.py se marcan aquí con __archivo.campo__ (p. ej. __firma.name__). -->
<table cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; line-height: 1.5;">
  <tr>
    <td style="padding: 10px; vertical-align: middle; text-align: center; background-color: #78A2D2; width: fit-content;">
      <img src="https://neurogarval.es/media/logo.svg" alt="NeuroGarval" width="150px" style="display: block;">
    </td>

    <td style="padding-left: 20px; padding-bottom: 10px; vertical-align: middle;" width="100%">
      <!-- pages:begin firma-identity -->
      <div style="font-size: 18px; font-weight: bold; color: #29335C;">
        __firma.name__
      </div>
      <div style="font-size: 16px; color: #333333;">__firma.license__</div>
      <div style="font-size: 14px; color: #29335C; font-weight: 600; margin-bottom: 5px;">
        __firma.role__
      </div>
      <!-- pages:end firma-identity -->

      <!-- pages:begin firma-contact -->
      <div style="font-size: 13px; color: #666666;">
        <a href="__settings.contact.phone__" style="color: #666666; text-decoration: none;">__settings.contact.phone__</a> |
        <a href="__firma.web_url__" style="color: #666666; text-decoration: none;">__firma.web_label__</a><br>
        <a href="__settings.contact.maps_url__" style="color: #666666; text-decoration: none;">__settings.contact.address_lines__</a>
      </div>
      <!-- pages:end firma-contact -->
    </td>
  </tr>

  <tr>
    <!-- pages:begin firma-legal -->
    <td colspan="2" style="padding-top: 20px; font-size: 10px; color: #999999; line-height: 1.2; text-align: justify;">
        __firma.legal_aviso__<br><br>
        __firma.legal_proteccion__
    <!-- pages:end firma-legal -->
    </td>
  </tr>
</table>
