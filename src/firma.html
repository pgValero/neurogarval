<!-- PLANTILLA DE LA FIRMA. El logo y su URL son fijos. Los marcadores
     que rellena build.py (formato: archivo.ruta.campo, sin los guiones
     bajos aquí para no confundir al build) se leen de content/firma.yml y
     content/common.yml (Pages CMS); .pages.yml declara los tipos de campo.
     El enlace del teléfono usa la clave derivada common.contact.phone_tel,
     que build.py calcula a partir de common.yml. -->
<table cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; line-height: 1.5;">
  <tr>
    <td style="padding: 10px; vertical-align: middle; text-align: center; background-color: #78A2D2; width: fit-content;">
      <img src="https://neurogarval.es/logo.svg" alt="NeuroGarval" width="150px" style="display: block;">
    </td>

    <td style="padding-left: 20px; padding-bottom: 10px; vertical-align: middle;" width="100%">
      <div style="font-size: 18px; font-weight: bold; color: #29335C;">
        __firma.name__
      </div>
      <div style="font-size: 16px; color: #333333;">__firma.license__</div>
      <div style="font-size: 14px; color: #29335C; font-weight: 600; margin-bottom: 5px;">
        __firma.role__
      </div>

      <div style="font-size: 13px; color: #666666;">
        <a href="__common.contact.phone_tel__" style="color: #666666; text-decoration: none;">__common.contact.phone__</a> |
        <a href="__firma.web_url__" style="color: #666666; text-decoration: none;">__firma.web_label__</a><br>
        <a href="__common.contact.maps_url__" style="color: #666666; text-decoration: none;">__common.contact.address_lines__</a>
      </div>
    </td>
  </tr>

  <tr>
    <td colspan="2" style="padding-top: 20px; font-size: 10px; color: #999999; line-height: 1.2; text-align: justify;">
        __firma.legal_aviso__<br><br>
        __firma.legal_proteccion__
    </td>
  </tr>
</table>
