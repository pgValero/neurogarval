# Configuración de hooks para usar con prek (compatible también con pre-commit).
# Instalar los hooks:   prek install
# Ejecutar a mano:      prek run --all-files
repos:
  # Linters locales: HTML, CSS y JavaScript
  - repo: local
    hooks:
      # 1) Linter de HTML
      - id: htmlhint
        name: HTMLHint (HTML)
        language: node
        entry: htmlhint
        files: \.html?$
        additional_dependencies: [htmlhint]
        args:
          - --rules
          - tag-pair,tagname-lowercase,attr-no-duplication,attr-value-double-quotes,id-unique

      # 2) Linter de CSS (lee .stylelintrc.json)
      - id: stylelint
        name: Stylelint (CSS)
        language: node
        entry: stylelint
        files: \.css$
        additional_dependencies: [stylelint]

      # 3) Linter de JavaScript (lee eslint.config.js)
      - id: eslint
        name: ESLint (JavaScript)
        language: node
        entry: eslint
        files: \.m?js$
        additional_dependencies: [eslint]

  # 4) Validador de URLs rotas (HTML, enlaces locales y externos)
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: Lychee (URLs rotas)
        files: \.html?$
        args:
          - --no-progress
          - "--exclude=^tel:"
          # data.js lo genera build.py; no existe en el árbol fuente:
          - "--exclude=data\\.js"
          # Las plantillas de src/ usan rutas relativas al HTML publicado;
          # esos ficheros se comprueban en el _site generado, no junto a src/.
          - "--exclude=file:///.*/src/(aviso_legal\\.pdf|favicon\\.svg|media/)"
          # URLs absolutas a media/ aún no publicadas (retirar tras el 1er despliegue):
          - "--exclude=neurogarval\\.es/media/"
