# ============================================================================
# Pages CMS — configuración del repositorio neurogarval
# https://pagescms.org · Documentación: /docs/configuration
#
# Este archivo define TODO lo que se puede editar desde Pages CMS:
#   media    -> dónde se guardan las imágenes y qué URL se escribe en el contenido
#   content  -> las "colecciones" (archivos) editables y sus campos
#   components -> definiciones de campo reutilizables
#   actions  -> botones opcionales (despliegue manual)
#
# CÓMO SE RELACIONA CON EL SITIO:
#   Los ficheros de content/*.yml NO los lee el navegador directamente.
#   build.py (ejecutado por .github/workflows/deploy.yml de forma automática
#   al mergear en main la PR de publicación, y también a mano con "Run
#   workflow"; nunca con commits de contenido) sustituye los marcadores
#   __archivo.ruta.campo__ de src/index.html y src/firma.html por estos datos,
#   escribe el contacto en los huecos .neuro-* del HTML generado (sin
#   JavaScript), escribe el contenido de los modales en el propio HTML y publica
#   el resultado.
#
#   Este archivo es también el REGISTRO DE TIPOS del build: cada campo que
#   aparece en un marcador debe estar declarado aquí con su tipo; build.py
#   usa esa declaración para saber si es Markdown (rich-text), imagen, icono
#   o texto simple, y falla si un campo referenciado no está declarado.
#   Los campos de contenido largo de la página son rich-text con formato
#   Markdown. Escribe párrafos, énfasis y listas en un único campo; build.py
#   los convierte a HTML. No escribas HTML en esos campos. Títulos, botones,
#   etiquetas y metadatos siguen siendo campos simples. Las listas
#   estructurales (pasos, tarjetas, fotos, etc.) conservan sus campos.
#   Las tarjetas e ítems de esas listas se repiten en la plantilla con
#   bloques @foreach (ver expand_loops en build.py): añadir o quitar
#   entradas aquí no exige tocar el HTML.
#   Dominio, logo, SEO (title, description, canonical) y navegación son parte
#   fija de src/index.html y no se editan desde el CMS. El bloque JSON-LD sí
#   se genera: build.py lo construye desde content/clinic_info.yml (solo
#   lectura) y desde servicios, modalidades, faq, blog y especialista.
#
# NOTA SOBRE RAMAS: Pages CMS lee este archivo por rama y el CMS se usa sobre
# develop: se abre en https://app.pagescms.org/pgValero/neurogarval/develop y
# todos los commits de contenido caen en develop. main está protegida (solo PR)
# y no recibe empujes directos. El botón "Publicar cambios" (acciones abajo)
# lanza .github/workflows/publicar.yml, que crea/reutiliza la PR develop -> main
# y la deja marcada para auto-merge con rebase: GitHub la mergea sola cuando
# pasan los checks obligatorios; al mergear, el push a
# main dispara el despliegue (deploy.yml). desarrollos técnicos fuera del CMS
# también van por develop y entran en main por la misma PR.
# ============================================================================

# ---------------------------------------------------------------------------
# MEDIA: subida de recursos estáticos desde el CMS.
# input  = carpeta física en el repo; output = URL pública que el CMS escribe
# (p. ej. "/media/photo.jpeg"). build.py la convierte a ruta relativa
# "media/..." para el HTML. Los PDFs y el favicon también están en media/ en
# el repositorio, pero el build los publica en la raíz para conservar las
# rutas públicas actuales; no son contenido editable del CMS.
# ---------------------------------------------------------------------------
media:
  input: media
  output: /media

# ---------------------------------------------------------------------------
# COMPONENTS: campo de icono reutilizado en servicios, modalidades y proceso.
# IMPORTANTE: los values deben coincidir con las claves del diccionario ICONS
# en build.py; si añades un icono aquí, añádelo también allí (y al CSS/base
# de Bootstrap Icons si es un "bi bi-*").
# ---------------------------------------------------------------------------
components:
  icono:
    type: select
    label: Icono
    description: "Icono del listado. No hace falta escribir código: elige uno de la lista."
    options:
      placeholder: Elige un icono
      values:
        - name: brain
          label: Cerebro
        - name: heart
          label: Corazón con pulso
        - name: zap
          label: Rayo
        - name: message
          label: Burbuja de mensaje
        - name: calendar
          label: Calendario
        - name: clipboard
          label: Portapapeles
        - name: target
          label: Diana
        - name: chart
          label: Gráfico ascendente
        - name: building
          label: Edificio (clínica)
        - name: laptop
          label: Portátil (online)
        - name: house
          label: Casa (domicilio)
        - name: journal
          label: Libro (artículos)

# ---------------------------------------------------------------------------
# CONTENT: archivos editables (un fichero por sección + datos comunes).
# type: file  => cada fichero es una entrada independiente en Pages CMS, con
#                su propio esquema. Los "name" deben coincidir con las claves
#                del diccionario CONTEXT de build.py y con los ficheros de
#                content/.
# operations.delete: false => evita que un editor borre el fichero y rompa el build.
# common.yml (contacto que se repite en varios sitios) y footer.yml son de
# solo lectura: se editan en el repositorio.
# ---------------------------------------------------------------------------
content:
  # ---------------------------------------------------------------------
  # 1) Datos comunes (solo lectura): contacto repetido en hero, sección
  #    Contacto, footer y firma de email.
  # ---------------------------------------------------------------------
  - name: common
    label: Datos comunes (solo lectura)
    type: file
    path: content/common.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: contact
        label: Contacto
        type: object
        readonly: true
        description: Datos fijos; no se pueden modificar desde Pages CMS.
        fields:
          - name: phone
            label: Teléfono
            type: string
            required: true
            pattern: "^\\+34[\\s-]?\\d{3}[\\s-]?\\d{3}[\\s-]?\\d{3}$"
            description: Formato +34 XXX XXX XXX. Se usa en la web (hero, contacto, footer) y en la firma.
          - name: mail
            label: Email
            type: string
            required: true
            pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          - name: address_lines
            label: Dirección
            type: string
            required: true
            list:
              min: 2
              max: 2
            description: "Dos líneas fijas: 1) calle y número; 2) CP, ciudad y provincia."
          - name: maps_url
            label: Enlace de Google Maps
            type: string
            required: true

  # ---------------------------------------------------------------------
  # 2) Secciones de la página (src/index.html), una por fichero.
  # ---------------------------------------------------------------------
  - name: hero
    label: "Sección: Hero (cabecera)"
    type: file
    path: content/hero.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: badge
        label: Distintivo superior
        type: string
        required: true
      - name: title
        label: Título
        type: string
        required: true
      - name: title_accent
        label: Título (parte de acento)
        type: string
        description: Se muestra en <i> con color azul. Déjalo vacío si no quieres acento.
      - name: modalities
        label: Línea de modalidades
        type: string
        required: true
        description: Separada por "·", p. ej. "Clínica en Valdemoro · Online · A domicilio".
      - name: paragraph
        label: Párrafo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: promo
        label: Aviso destacado
        type: string
        description: Caja azul con "i" (p. ej. primera consulta gratuita).
      - name: image
        label: Imagen lateral
        type: image
        required: true
      - name: image_alt
        label: Texto alternativo de la imagen
        type: string
        required: true

  - name: servicios
    label: "Sección: Servicios"
    type: file
    path: content/servicios.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: more_label
        label: Enlace de tarjeta
        type: string
        required: true
        description: Texto de "Más información" en cada tarjeta.
      - name: items
        label: Servicios (tarjetas + modal)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: Identificador
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
            description: "Identificador interno único. Abre el modal de la tarjeta (openServiceModal('id')); minúsculas, números y guiones. Evita cambiarlo tras publicar si alguien enlaza a él."
          - name: icon
            component: icono
          - name: title
            label: Título de la tarjeta
            type: string
            required: true
          - name: card_text
            label: Texto de la tarjeta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
          - name: modal_content
            label: Contenido del modal (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Lo que se ve al pulsar "Más información". Escribe párrafos y listas en Markdown.

  - name: modalidades
    label: "Sección: Modalidades"
    type: file
    path: content/modalidades.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: more_label
        label: Enlace de tarjeta
        type: string
        required: true
        description: Texto de "Más información" en cada tarjeta.
      - name: items
        label: Modalidades (tarjetas + modal)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            component: icono
          - name: title
            label: Título
            type: string
            required: true
          - name: text
            label: Texto de la tarjeta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
          - name: modal_content
            label: Contenido del modal (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Escribe los párrafos y listas del modal en Markdown.
          - name: images
            label: Fotos del modal (opcional)
            type: object
            list: true
            collapsible: true
            description: Se muestran al final del contenido de la modalidad. Deja la lista vacía si no necesita fotos.
            fields:
              - name: image
                label: Imagen (vacío = icono de reserva)
                type: image
              - name: alt
                label: Texto alternativo
                type: string
                required: true

  - name: proceso
    label: "Sección: Proceso"
    type: file
    path: content/proceso.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: steps
        label: Pasos (el número se genera solo)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            component: icono
          - name: title
            label: Título del paso
            type: string
            required: true
          - name: text
            label: Texto del paso (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown

  - name: especialista
    label: "Sección: Especialista"
    type: file
    path: content/especialista.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: image
        label: Foto de perfil
        type: image
        required: true
      - name: image_alt
        label: Texto alternativo de la foto
        type: string
        required: true
      - name: name
        label: Nombre (tarjeta de colegiada)
        type: string
        required: true
      - name: license
        label: Nº de colegiada
        type: string
        required: true
      - name: heading
        label: Título
        type: string
        required: true
      - name: content
        label: Contenido (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
        description: Escribe aquí todos los párrafos de la sección. Separa los párrafos con una línea en blanco.

  - name: blog
    label: "Sección: Blog (tarjetas)"
    type: file
    path: content/blog.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: read_more
        label: Enlace "Leer más"
        type: string
        required: true
      - name: posts
        label: Publicaciones
        type: object
        list: true
        collapsible:
          collapsed: true
          summary: "{title}"
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: excerpt
            label: Resumen de la tarjeta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Texto corto que se muestra en la tarjeta del blog.
          - name: article
            label: Texto del artículo (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Texto completo del artículo; se muestra al abrir la tarjeta como un modal.
          - name: image
            label: Imagen de portada (opcional)
            type: image
            description: Se usa en la tarjeta y en el modal. Sin imagen se muestra un icono de reserva.

  - name: faq
    label: "Sección: Preguntas frecuentes"
    type: file
    path: content/faq.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: items
        label: Preguntas
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Pregunta
            type: string
            required: true
          - name: answer
            label: Respuesta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown

  - name: contacto
    label: "Sección: Contacto"
    type: file
    path: content/contacto.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: highlight
        label: Frase destacada (negrita)
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: map_embed
        label: Mapa de Google (src del iframe)
        type: text
        required: true
        description: "En Google Maps: Compartir > Insertar un mapa > copiar la URL del iframe."
      - name: instagram
        label: Instagram (tarjeta de contacto)
        type: object
        description: Teléfono, email, dirección y Maps vienen de Datos comunes.
        fields:
          - name: url
            label: Perfil (URL)
            type: string
            required: true
          - name: handle
            label: Usuario (con @)
            type: string
            required: true
            pattern: "^@[A-Za-z0-9._]+$"

  - name: clinic_info
    label: Datos de la clínica (solo lectura)
    type: file
    path: content/clinic_info.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: datos_estructurados
        label: Datos estructurados
        type: boolean
        required: true
        readonly: true
        description: Campo técnico; activa el bloque JSON-LD de src/index.html. No se edita.
      - name: area_served
        label: Municipios de atención presencial
        type: string
        required: true
        readonly: true
        list: true
        description: Municipios que se publican como "areaServed" en los datos estructurados (SEO local).
      - name: online_area
        label: Zona de la terapia online
        type: string
        required: true
        readonly: true
        description: "La terapia online no tiene zona; se indica el país desde el que se atiende."
      - name: price_range
        label: Rango de precio orientativo
        type: string
        required: true
        readonly: true
        description: Solo para los buscadores ($, $$ o $$$). No se muestra en la web.

  - name: footer
    label: Footer (solo lectura)
    type: file
    path: content/footer.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: lines
        label: Texto bajo el logo
        type: string
        required: true
        readonly: true
        list:
          min: 2
          max: 2
        description: Dos líneas fijas; se unen con un salto de línea.
      - name: legal_label
        label: Texto del enlace legal
        type: string
        required: true
        readonly: true
      - name: legal_file
        label: Archivo del enlace legal
        type: string
        readonly: true
        description: aviso_legal.pdf vive en media/ en el repositorio y se publica en la raíz; no se edita desde el CMS.
      - name: copyright
        label: Copyright
        type: string
        required: true
        readonly: true
        description: Va tras el ©. Actualiza el año cuando cambie.

  # ---------------------------------------------------------------------
  # 3) Firma de email (src/firma.html, archivo aparte del sitio).
  # Los avisos legales son texto plano de solo lectura: el email no usa
  # el renderer Markdown de la página.
  # ---------------------------------------------------------------------
  - name: firma
    label: Firma de email
    type: file
    path: content/firma.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: license
        label: Nº de colegiada
        type: string
        required: true
      - name: role
        label: Cargo
        type: string
        required: true
      - name: web_label
        label: Web (texto visible)
        type: string
        required: true
      - name: web_url
        label: Web (enlace)
        type: string
        required: true
        pattern: "^https://[^/\\s]+$"
      - name: legal_aviso
        label: Aviso legal
        type: text
        required: true
        readonly: true
        description: Texto legal — no modificar sin asesoría.
      - name: legal_proteccion
        label: Protección de datos
        type: text
        required: true
        readonly: true
        description: Texto legal — no modificar sin asesoría.

# ---------------------------------------------------------------------------
# ACTIONS (opcional): botón "Publicar cambios" en Pages CMS.
# El botón lanza .github/workflows/publicar.yml (workflow_dispatch sobre la
# rama en la que se está editando, develop): crea/reutiliza la PR
# develop -> main, la marca para auto-merge con rebase y, al mergear, se
# dispara el despliegue automático (deploy.yml con push a main).
# Requiere que las ramas main y develop tengan el workflow (lo tendrán tras la
# primera PR de migración) y que main esté protegida con el status check
# "checks" como obligatorio (ver AGENTS.md, sección "Layout & deploy").
# IMPORTANTE: Pages CMS envía siempre un input "payload" (JSON) al lanzar el
# workflow; por eso on.workflow_dispatch de publicar.yml (y de deploy.yml)
# declara el input payload, o la API de GitHub rechaza el evento con
# "Unexpected inputs provided: [\"payload\"]".
# ---------------------------------------------------------------------------
actions:
  - name: publicar
    label: Publicar cambios
    workflow: create_pr.yml

