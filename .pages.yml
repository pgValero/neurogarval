# ============================================================================
# Pages CMS — configuración del repositorio neurogarval
# https://pagescms.org · Documentación: /docs/configuration
#
# Este archivo define TODO lo que se puede editar desde Pages CMS:
#   media    -> dónde se guardan las imágenes y qué URL se escribe en el contenido
#   content  -> las "colecciones" (archivos) editables y sus campos
#   components -> definiciones de campo reutilizables
#   actions  -> botones opcionales (despliegue manual)
#
# CÓMO SE RELACIONA CON EL SITIO:
#   Los ficheros de content/*.yml NO los lee el navegador directamente.
#   build.py (ejecutado por .github/workflows/deploy.yml en cada push a main)
#   inyecta estos datos en las regiones <!-- pages:begin ... --> de
#   src/index.html y src/firma.html, escribe el contacto en los huecos
#   .neuro-* del HTML generado (sin JavaScript), genera _site/data.js
#   (contenido de los modales) y publica el resultado.
#
#   Los campos de contenido largo de la página son rich-text con formato
#   Markdown. Escribe párrafos, énfasis y listas en un único campo; build.py
#   los convierte a HTML. No escribas HTML en esos campos. Títulos, botones,
#   etiquetas y metadatos siguen siendo campos simples. Las listas
#   estructurales (pasos, tarjetas, fotos, etc.) conservan sus campos.
#   Dominio, logo, SEO/JSON-LD y navegación son parte fija de src/index.html y
#   no se editan desde el CMS.
#
# NOTA SOBRE RAMAS: Pages CMS lee este archivo por rama; se usa la rama
# por defecto del repositorio (main). develop queda para trabajo técnico.
# ============================================================================

# ---------------------------------------------------------------------------
# MEDIA: subida de recursos estáticos desde el CMS.
# input  = carpeta física en el repo; output = URL pública que el CMS escribe
# (p. ej. "/media/photo.jpeg"). build.py la convierte a ruta relativa
# "media/..." para el HTML. Los PDFs y el favicon también están en media/ en
# el repositorio, pero el build los publica en la raíz para conservar las
# rutas públicas actuales; no son contenido editable del CMS.
# ---------------------------------------------------------------------------
media:
  input: media
  output: /media

# ---------------------------------------------------------------------------
# COMPONENTS: campo de icono reutilizado en servicios, modalidades y proceso.
# IMPORTANTE: los values deben coincidir con las claves del diccionario ICONS
# en build.py; si añades un icono aquí, añádelo también allí (y al CSS/base
# de Bootstrap Icons si es un "bi bi-*").
# ---------------------------------------------------------------------------
components:
  icono:
    type: select
    label: Icono
    description: "Icono del listado. No hace falta escribir código: elige uno de la lista."
    options:
      placeholder: Elige un icono
      values:
        - name: brain
          label: Cerebro
        - name: heart
          label: Corazón con pulso
        - name: zap
          label: Rayo
        - name: message
          label: Burbuja de mensaje
        - name: calendar
          label: Calendario
        - name: clipboard
          label: Portapapeles
        - name: target
          label: Diana
        - name: chart
          label: Gráfico ascendente
        - name: building
          label: Edificio (clínica)
        - name: laptop
          label: Portátil (online)
        - name: house
          label: Casa (domicilio)
        - name: journal
          label: Libro (artículos)

# ---------------------------------------------------------------------------
# CONTENT: archivos editables (un fichero por sección + datos comunes).
# type: file  => cada fichero es una entrada independiente en Pages CMS, con
#                su propio esquema. Los "name" deben coincidir con las claves
#                del diccionario CONTEXT de build.py y con los ficheros de
#                content/.
# operations.delete: false => evita que un editor borre el fichero y rompa el build.
# common.yml (contacto que se repite en varios sitios) y footer.yml son de
# solo lectura: se editan en el repositorio.
# ---------------------------------------------------------------------------
content:
  # ---------------------------------------------------------------------
  # 1) Datos comunes (solo lectura): contacto repetido en hero, sección
  #    Contacto, footer y firma de email.
  # ---------------------------------------------------------------------
  - name: common
    label: Datos comunes (solo lectura)
    type: file
    path: content/common.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: contact
        label: Contacto
        type: object
        readonly: true
        description: Datos fijos; no se pueden modificar desde Pages CMS.
        fields:
          - name: phone
            label: Teléfono
            type: string
            required: true
            pattern: "^\\+34[\\s-]?\\d{3}[\\s-]?\\d{3}[\\s-]?\\d{3}$"
            description: Formato +34 XXX XXX XXX. Se usa en la web (hero, contacto, footer) y en la firma.
          - name: mail
            label: Email
            type: string
            required: true
            pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          - name: address_lines
            label: Dirección
            type: string
            required: true
            list:
              min: 2
              max: 2
            description: "Dos líneas fijas: 1) calle y número; 2) CP, ciudad y provincia."
          - name: maps_url
            label: Enlace de Google Maps
            type: string
            required: true

  # ---------------------------------------------------------------------
  # 2) Secciones de la página (src/index.html), una por fichero.
  # ---------------------------------------------------------------------
  - name: hero
    label: "Sección: Hero (cabecera)"
    type: file
    path: content/hero.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: badge
        label: Distintivo superior
        type: string
        required: true
      - name: title
        label: Título
        type: string
        required: true
      - name: title_accent
        label: Título (parte de acento)
        type: string
        description: Se muestra en <i> con color azul. Déjalo vacío si no quieres acento.
      - name: modalities
        label: Línea de modalidades
        type: string
        required: true
        description: Separada por "·", p. ej. "Clínica en Valdemoro · Online · A domicilio".
      - name: paragraph
        label: Párrafo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: promo
        label: Aviso destacado
        type: string
        description: Caja azul con "i" (p. ej. primera consulta gratuita).
      - name: image
        label: Imagen lateral
        type: image
        required: true
      - name: image_alt
        label: Texto alternativo de la imagen
        type: string
        required: true

  - name: servicios
    label: "Sección: Servicios"
    type: file
    path: content/servicios.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: more_label
        label: Enlace de tarjeta
        type: string
        required: true
        description: Texto de "Más información" en cada tarjeta.
      - name: areas
        label: Áreas de trabajo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
        description: Incluye la introducción y la lista de áreas con sintaxis Markdown.
      - name: items
        label: Servicios (tarjetas + modal)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            component: icono
          - name: title
            label: Título de la tarjeta
            type: string
            required: true
          - name: card_text
            label: Texto de la tarjeta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
          - name: modal_content
            label: Contenido del modal (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Lo que se ve al pulsar "Más información". Escribe párrafos y listas en Markdown.

  - name: modalidades
    label: "Sección: Modalidades"
    type: file
    path: content/modalidades.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: more_label
        label: Enlace de tarjeta
        type: string
        required: true
        description: Texto de "Más información" en cada tarjeta.
      - name: items
        label: Modalidades (tarjetas + modal)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            component: icono
          - name: title
            label: Título
            type: string
            required: true
          - name: text
            label: Texto de la tarjeta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
          - name: modal_content
            label: Contenido del modal (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Escribe los párrafos y listas del modal en Markdown.
          - name: images
            label: Fotos del modal (opcional)
            type: object
            list: true
            collapsible: true
            description: Se muestran al final del contenido de la modalidad. Deja la lista vacía si no necesita fotos.
            fields:
              - name: image
                label: Imagen (vacío = icono de reserva)
                type: image
              - name: alt
                label: Texto alternativo
                type: string
                required: true

  - name: proceso
    label: "Sección: Proceso"
    type: file
    path: content/proceso.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: steps
        label: Pasos (el número se genera solo)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            component: icono
          - name: title
            label: Título del paso
            type: string
            required: true
          - name: text
            label: Texto del paso (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown

  - name: especialista
    label: "Sección: Especialista"
    type: file
    path: content/especialista.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: image
        label: Foto de perfil
        type: image
        required: true
      - name: image_alt
        label: Texto alternativo de la foto
        type: string
        required: true
      - name: name
        label: Nombre (tarjeta de colegiada)
        type: string
        required: true
      - name: license
        label: Nº de colegiada
        type: string
        required: true
      - name: heading
        label: Título
        type: string
        required: true
      - name: content
        label: Contenido (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
        description: Escribe aquí todos los párrafos de la sección. Separa los párrafos con una línea en blanco.

  - name: blog
    label: "Sección: Blog (tarjetas)"
    type: file
    path: content/blog.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: read_more
        label: Enlace "Leer más"
        type: string
        required: true
      - name: posts
        label: Publicaciones
        type: object
        list: true
        collapsible:
          collapsed: true
          summary: "{title}"
        fields:
          - name: date
            label: Fecha (o texto)
            type: string
            required: true
            description: P. ej. "12/03/2026" o "Próximamente".
          - name: title
            label: Título
            type: string
            required: true
          - name: excerpt
            label: Artículo / resumen (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
            description: Escribe el texto del artículo o su resumen en un único campo Markdown.
          - name: url
            label: Enlace del artículo
            type: string
            required: true
            description: "«#» mientras no exista la página del artículo."
          - name: image
            label: Imagen (opcional)
            type: image
            description: Sin imagen se muestra un icono de reserva.

  - name: faq
    label: "Sección: Preguntas frecuentes"
    type: file
    path: content/faq.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: items
        label: Preguntas
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Pregunta
            type: string
            required: true
          - name: answer
            label: Respuesta (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown

  - name: contacto
    label: "Sección: Contacto"
    type: file
    path: content/contacto.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Título
        type: string
        required: true
      - name: highlight
        label: Frase destacada (negrita)
        type: string
        required: true
      - name: lead
        label: Subtítulo (Markdown)
        type: rich-text
        required: true
        options:
          format: markdown
      - name: map_embed
        label: Mapa de Google (src del iframe)
        type: text
        required: true
        description: "En Google Maps: Compartir > Insertar un mapa > copiar la URL del iframe."
      - name: instagram
        label: Instagram (tarjeta de contacto)
        type: object
        description: Teléfono, email, dirección y Maps vienen de Datos comunes.
        fields:
          - name: url
            label: Perfil (URL)
            type: string
            required: true
          - name: handle
            label: Usuario (con @)
            type: string
            required: true
            pattern: "^@[A-Za-z0-9._]+$"

  - name: footer
    label: Footer (solo lectura)
    type: file
    path: content/footer.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: lines
        label: Texto bajo el logo
        type: string
        required: true
        readonly: true
        list:
          min: 2
          max: 2
        description: Dos líneas fijas; se unen con un salto de línea.
      - name: legal_label
        label: Texto del enlace legal
        type: string
        required: true
        readonly: true
      - name: legal_file
        label: Archivo del enlace legal
        type: string
        readonly: true
        description: aviso_legal.pdf vive en media/ en el repositorio y se publica en la raíz; no se edita desde el CMS.
      - name: copyright
        label: Copyright
        type: string
        required: true
        readonly: true
        description: Va tras el ©. Actualiza el año cuando cambie.

  # ---------------------------------------------------------------------
  # 3) Firma de email (src/firma.html, archivo aparte del sitio).
  # Los avisos legales son texto plano de solo lectura: el email no usa
  # el renderer Markdown de la página.
  # ---------------------------------------------------------------------
  - name: firma
    label: Firma de email
    type: file
    path: content/firma.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: license
        label: Nº de colegiada
        type: string
        required: true
      - name: role
        label: Cargo
        type: string
        required: true
      - name: web_label
        label: Web (texto visible)
        type: string
        required: true
      - name: web_url
        label: Web (enlace)
        type: string
        required: true
        pattern: "^https://[^/\\s]+$"
      - name: legal_aviso
        label: Aviso legal
        type: text
        required: true
        readonly: true
        description: Texto legal — no modificar sin asesoría.
      - name: legal_proteccion
        label: Protección de datos
        type: text
        required: true
        readonly: true
        description: Texto legal — no modificar sin asesoría.

# ---------------------------------------------------------------------------
# ACTIONS (opcional): botón "Desplegar sitio" en Pages CMS.
# Requiere que el workflow tenga workflow_dispatch (lo tiene) y que la
# rama main esté configurada para desplegar con GitHub Actions.
# ---------------------------------------------------------------------------
actions:
  - name: desplegar
    label: Desplegar sitio
    workflow: deploy.yml

