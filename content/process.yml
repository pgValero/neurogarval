heading: Cómo empezar la terapia
lead: Un proceso claro y sin prisas, adaptado al ritmo y a las necesidades de
  cada persona.
steps:
  - icon: message
    title: Contacto
    text: Escríbeme por WhatsApp, teléfono o email y cuéntame brevemente qué
      necesitas.
  - icon: calendar
    title: Primera consulta
    text: Una primera sesión online, informativa y gratuita para conocernos y
      resolver tus dudas.
  - icon: clipboard
    title: Evaluación
    text: Valoración de la situación actual y, cuando sea necesario, evaluación
      específica para identificar necesidades y establecer un punto de partida.
  - icon: target
    title: Plan de intervención
    text: Propuesta personalizada con objetivos concretos y revisables.
  - icon: chart
    title: Seguimiento
    text: Sesiones periódicas y revisiones para ajustar el trabajo a los avances.
