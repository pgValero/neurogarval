heading: Modalidades de atención
lead: "Elegir el entorno adecuado para tus sesiones es importante: facilita el
  trabajo terapéutico y tu comodidad durante el proceso."
more_label: Más información
items:
  - icon: building
    title: Atención presencial
    text: Las sesiones se realizan en consulta, en un entorno tranquilo y
      profesional. La atención presencial está disponible en Valdemoro y
      próximamente en Segovia.
    modal_content: >-
      La atención presencial se realiza en consulta, en un entorno tranquilo y
      profesional, donde podemos trabajar de forma directa y cercana.


      - Realizar evaluaciones neuropsicológicas con las pruebas necesarias.

      - Trabajar las dificultades del día a día en un entorno adecuado.

      - Compartir con la persona y, cuando corresponda, con su familia las
      orientaciones del plan de intervención.


      El ambiente de consulta está pensado para recibirte con calma, cuidar tu
      privacidad y favorecer un trabajo cercano y personalizado. 
    images:
      - image: /media/IMG_8106 (1).jpg
        alt: Sala de terapia NeuroGarval
      - image: /media/Screenshot_20260927_020750.png
        alt: Recepción NeuroGarval
      - image: /media/Screenshot_20260927_020816.png
        alt: Entrada NeuroGarval
      - image: /media/Screenshot_20260927_020844.png
        alt: Consulta NeuroGarval
  - icon: laptop
    title: Atención online
    text: Sesiones por videollamada, con la comodidad de recibir atención desde casa
      o desde cualquier lugar. Una modalidad que evita desplazamientos y
      facilita la continuidad de las sesiones.
    modal_content: >-
      La terapia online se realiza mediante videollamada, lo que permite
      mantener el proceso terapéutico sin tener que desplazarse a la consulta.


      Antes de empezar se comprobará la disponibilidad de los medios necesarios
      y se organizará un espacio adecuado para favorecer la confidencialidad y
      la concentración.


      - Evita desplazamientos y facilita el acceso para quien tenga horarios
      limitados o dificultad para desplazarse.

      - Ofrece mayor flexibilidad para organizar las sesiones.

      - Permite mantener la continuidad de la intervención desde un lugar
      cómodo.


      El acompañamiento y los objetivos del plan de intervención se adaptan a
      esta modalidad, manteniendo un contacto directo y personalizado.
  - icon: house
    title: A Domicilio
    text: Atención en el entorno habitual de la persona, dirigida a quienes tienen
      dificultades para desplazarse o para quienes el domicilio resulta el
      contexto más adecuado para la intervención.
    modal_content: >-
      La atención a domicilio realiza la intervención en el lugar donde vives,
      siempre que esta modalidad sea adecuada para tu situación y exista un
      espacio suficiente para trabajar con comodidad.


      Este formato permite conocer mejor el contexto cotidiano y las rutinas de
      la persona, para adaptar la intervención a sus necesidades reales.


      - Evita desplazamientos y permite realizar la sesión en casa.

      - Permite conocer mejor las rutinas y las estrategias que necesitarás en
      tu día a día.

      - Facilita la intervención cuando existen dificultades de movilidad o para
      desplazarse.


      La idoneidad de esta modalidad y las condiciones del espacio se valoran
      previamente para acordar el plan de trabajo más adecuado.
