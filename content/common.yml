# ============================================================
# DATOS COMUNES (solo lectura en Pages CMS)
# Fuente única del contacto que se repite en varios sitios: hero,
# sección Contacto, footer y firma de email. Para cambiar estos datos,
# edita este archivo en el repositorio; el CMS los muestra sin permitir
# modificaciones. build.py escribe el contacto en los huecos .neuro-*
# del HTML generado (sin JavaScript) y alimenta también la firma.
# El dominio, el logo, el SEO y los datos estructurados son parte fija
# de src/index.html.
# ============================================================

