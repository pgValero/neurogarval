heading: Compromiso con tu salud mental
content: >
  Bienvenido/a!


  Soy Teresa, neuropsicóloga y psicóloga general sanitaria, y he creado
  NeuroGarval con la idea de ofrecer un espacio profesional y cercano.


  Desde que comencé mi formación en Psicología, me ha interesado especialmente
  comprender cómo funciona el cerebro y cómo se relaciona con aspectos como la
  atención, la memoria, el aprendizaje, las emociones y la conducta.


  La neuropsicología me permite acercarme a estas dificultades teniendo en
  cuenta cómo pueden influir en el día a día de cada persona. Trabajo con niños,
  adolescentes, adultos y personas mayores, tanto en el ámbito neuropsicológico
  como desde la psicología sanitaria.


  Me gusta conocer la historia y las necesidades de cada persona para plantear
  objetivos que sean útiles y aplicables a su vida cotidiana.


  Además, sigo formándome de manera continua para mantenerme actualizada y
  ofrecer una atención basada en la evidencia científica.  
