services:
  heading: ¿En qué puedo ayudarte?
  lead: |-
    Trabajo en el ámbito de la neuropsicología y la psicología sanitaria, teniendo en cuenta las necesidades y el momento vital de cada persona.
  # Texto del enlace de cada tarjeta.
  more_label: Más información
  # Introducción y lista de áreas en un único campo Markdown.
  areas: |-
    Principales áreas que se trabajan en consulta:

    - Dificultades de aprendizaje.
    - Trastorno por Déficit de Atención e Hiperactividad (TDAH).
    - Trastorno del Espectro Autista (TEA).
    - Deterioro cognitivo.
    - Daño Cerebral Adquirido (DCA).
    - Dificultades emocionales y conductuales.
  # Cada servicio conserva sus datos de tarjeta y tiene un único contenido
  # Markdown para el modal.
  items:
    - icon: brain
      title: Neuropsicología
      card_text: |-
        Evaluación e intervención en dificultades cognitivas, conductuales y emocionales relacionadas con el funcionamiento cerebral.
      modal_content: |-
        La neuropsicología estudia la relación entre el funcionamiento del cerebro y la conducta: atención, memoria, lenguaje, funciones ejecutivas, visopercepción y velocidad de procesamiento, entre otras.

        El objetivo es comprender cómo estas funciones influyen en el día a día y diseñar una intervención ajustada a cada persona.

        - Entrevista inicial con la persona y/o la familia.
        - Evaluación con pruebas estandarizadas.
        - Devolución de resultados y orientaciones.
        - Plan de intervención personalizado.

        Dirigido a niños, adolescentes y adultos con TDAH, TEA, dificultades de aprendizaje, daño cerebral adquirido o deterioro cognitivo, entre otros.
    - icon: heart
      title: Psicología Sanitaria
      card_text: |-
        Atención a dificultades emocionales y conductuales, proporcionando un espacio profesional y seguro donde poder abordarlas.
      modal_content: |-
        Un espacio profesional y seguro para atender dificultades emocionales y conductuales, entendiendo el momento vital de cada persona.

        Se trabaja desde un enfoque cercano y basado en la evidencia, con objetivos claros y revisables.

        - Ansiedad, estrés y estado de ánimo.
        - Autoestima y gestión emocional.
        - Habilidades sociales y pautas para la familia.
        - Duelo y procesos de adaptación.

        Atención a niños, adolescentes y adultos, de forma individual o con la familia cuando es necesario.
    - icon: zap
      title: Rehabilitación
      card_text: |-
        Programas de intervención personalizados orientados a la rehabilitación, estimulación y mantenimiento de las funciones cognitivas.
      modal_content: |-
        Programas personalizados orientados a rehabilitar, estimular y mantener las funciones cognitivas, partiendo de los objetivos y la rutina de cada persona.

        - Estimulación cognitiva individual.
        - Entrenamiento en estrategias y compensación.
        - Asesoramiento a familiares y cuidadores.
        - Seguimiento periódico de avances.

        Disponible en clínica, online o a domicilio, según las necesidades.

modalities:
  heading: Modalidades de atención
  lead: |-
    Elegir el entorno adecuado para tus sesiones es importante: facilita el trabajo terapéutico y tu comodidad durante el proceso.
  # Texto del enlace de cada tarjeta.
  more_label: Más información
  # Cada modalidad conserva sus datos de tarjeta, su contenido Markdown y las
  # fotos opcionales del modal.
  items:
    - icon: building
      title: Atención en Clínica
      text: |-
        En consulta presencial, en un entorno profesional y tranquilo, pensado para que puedas sentirte cómodo/a durante las sesiones.
      modal_content: |-
        La atención en clínica se realiza de forma presencial, en un entorno profesional y tranquilo pensado para que puedas sentirte cómodo/a durante las sesiones.

        Este formato dispone de un espacio adecuado para la evaluación y las sesiones, con la presencia de la profesional durante todo el proceso.

        - Realizar evaluaciones neuropsicológicas con las pruebas necesarias.
        - Trabajar las dificultades del día a día en un entorno adecuado.
        - Compartir con la persona y, cuando corresponda, con su familia las orientaciones del plan de intervención.

        El ambiente de consulta está pensado para recibirte con calma, cuidar tu privacidad y favorecer un trabajo cercano y personalizado.
      images:
        # Sube las fotos de la consulta desde el CMS (media/).
        # Mientras "image" esté vacío se muestra el icono de cámara de reserva.
        - image: ""
          alt: Consulta NeuroGarval
        - image: ""
          alt: Sala de terapia NeuroGarval
        - image: ""
          alt: Zona de evaluación NeuroGarval
        - image: ""
          alt: Despacho NeuroGarval
        - image: ""
          alt: Sala de espera NeuroGarval
        - image: ""
          alt: Material de consulta NeuroGarval
    - icon: laptop
      title: Terapia Online
      text: |-
        Sesiones por videollamada, facilitando el acceso a la intervención sin necesidad de desplazamiento.
      modal_content: |-
        La terapia online se realiza mediante videollamada, lo que permite mantener el proceso terapéutico sin tener que desplazarse a la consulta.

        Antes de empezar se comprobará la disponibilidad de los medios necesarios y se organizará un espacio adecuado para favorecer la confidencialidad y la concentración.

        - Evita desplazamientos y facilita el acceso para quien tenga horarios limitados o dificultad para desplazarse.
        - Ofrece mayor flexibilidad para organizar las sesiones.
        - Permite mantener la continuidad de la intervención desde un lugar cómodo.

        El acompañamiento y los objetivos del plan de intervención se adaptan a esta modalidad, manteniendo un contacto directo y personalizado.
    - icon: house
      title: A Domicilio
      text: |-
        Intervención en tu entorno cotidiano, ideal para pacientes con movilidad reducida o dificultades específicas.
      modal_content: |-
        La atención a domicilio realiza la intervención en el lugar donde vives, siempre que esta modalidad sea adecuada para tu situación y exista un espacio suficiente para trabajar con comodidad.

        Este formato permite conocer mejor el contexto cotidiano y las rutinas de la persona, para adaptar la intervención a sus necesidades reales.

        - Evita desplazamientos y permite realizar la sesión en casa.
        - Permite conocer mejor las rutinas y las estrategias que necesitarás en tu día a día.
        - Facilita la intervención cuando existen dificultades de movilidad o para desplazarse.

        La idoneidad de esta modalidad y las condiciones del espacio se valoran previamente para acordar el plan de trabajo más adecuado.

process:
  heading: Cómo empezar la terapia
  lead: |-
    Un proceso claro y sin prisas, adaptado al ritmo y a las necesidades de cada persona.
  # El número de cada paso (1, 2, 3...) se genera solo por orden de la lista.
  steps:
    - icon: message
      title: Contacto
      text: |-
        Escríbeme por WhatsApp, teléfono o email y cuéntame brevemente qué necesitas.
    - icon: calendar
      title: Primera consulta
      text: |-
        Una entrevista informativa y gratuita para conocernos y resolver tus dudas.
    - icon: clipboard
      title: Evaluación
      text: |-
        Valoración de la situación y, cuando procede, pruebas para conocer el punto de partida.
    - icon: target
      title: Plan de intervención
      text: |-
        Propuesta personalizada con objetivos concretos y revisables.
    - icon: chart
      title: Seguimiento
      text: |-
        Sesiones periódicas y revisiones para ajustar el trabajo a los avances.

