services:
  heading: ¿En qué puedo ayudarte?
  lead: Trabajo en el ámbito de la neuropsicología y la psicología sanitaria, teniendo en cuenta las necesidades y el momento vital de cada persona.
  # Texto del enlace de cada tarjeta.
  more_label: Más información
  areas_intro: "Principales áreas que se trabajan en consulta:"
  # Lista de viñetas con icono de check.
  areas:
    - Dificultades de aprendizaje.
    - Trastorno por Déficit de Atención e Hiperactividad (TDAH).
    - Trastorno del Espectro Autista (TEA).
    - Deterioro cognitivo.
    - Daño Cerebral Adquirido (DCA).
    - Dificultades emocionales y conductuales.
  # Cada servicio genera una tarjeta y su modal (modal_content = HTML).
  items:
    - icon: brain
      title: Neuropsicología
      card_text: Evaluación e intervención en dificultades cognitivas, conductuales y emocionales relacionadas con el funcionamiento cerebral.
      modal_content: |-
        <p>La neuropsicología estudia la relación entre el funcionamiento del cerebro y la conducta: atención, memoria, lenguaje, funciones ejecutivas, visopercepción y velocidad de procesamiento, entre otras.</p>
        <p>El objetivo es comprender cómo estas funciones influyen en el día a día y diseñar una intervención ajustada a cada persona.</p>
        <ul>
            <li>Entrevista inicial con la persona y/o la familia.</li>
            <li>Evaluación con pruebas estandarizadas.</li>
            <li>Devolución de resultados y orientaciones.</li>
            <li>Plan de intervención personalizado.</li>
        </ul>
        <p>Dirigido a niños, adolescentes y adultos con TDAH, TEA, dificultades de aprendizaje, daño cerebral adquirido o deterioro cognitivo, entre otros.</p>
    - icon: heart
      title: Psicología Sanitaria
      card_text: Atención a dificultades emocionales y conductuales, proporcionando un espacio profesional y seguro donde poder abordalas.
      modal_content: |-
        <p>Un espacio profesional y seguro para atender dificultades emocionales y conductuales, entendiendo el momento vital de cada persona.</p>
        <p>Se trabaja desde un enfoque cercano y basado en la evidencia, con objetivos claros y revisables.</p>
        <ul>
            <li>Ansiedad, estrés y estado de ánimo.</li>
            <li>Autoestima y gestión emocional.</li>
            <li>Habilidades sociales y pautas para la familia.</li>
            <li>Duelo y procesos de adaptación.</li>
        </ul>
        <p>Atención a niños, adolescentes y adultos, de forma individual o con la familia cuando es necesario.</p>
    - icon: zap
      title: Rehabilitación
      card_text: Programas de intervención personalizados orientados a la rehabilitación, estimulación y mantenimiento de las funciones cognitivas.
      modal_content: |-
        <p>Programas personalizados orientados a rehabilitar, estimular y mantener las funciones cognitivas, partiendo de los objetivos y la rutina de cada persona.</p>
        <ul>
            <li>Estimulación cognitiva individual.</li>
            <li>Entrenamiento en estrategias y compensación.</li>
            <li>Asesoramiento a familiares y cuidadores.</li>
            <li>Seguimiento periódico de avances.</li>
        </ul>
        <p>Disponible en clínica, online o a domicilio, según las necesidades.</p>

modalities:
  heading: Modalidades de atención
  lead: "Elegir el entorno adecuado para tus sesiones es importante: facilita el trabajo terapéutico y tu comodidad durante el proceso."
  items:
    - icon: building
      title: Atención en Clínica
      text: En consulta presencial, en un entorno profesional y tranquilo, pensado para que puedas sentirte cómodo/a durante las sesiones.
    - icon: laptop
      title: Terapia Online
      text: Sesiones por videollamada, facilitando el acceso a la intervención sin necesidad de desplazamiento.
    - icon: house
      title: A Domicilio
      text: Intervención en tu entorno cotidiano, ideal para pacientes con movilidad reducida o dificultades específicas.

