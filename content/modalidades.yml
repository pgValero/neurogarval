  - icon: laptop
    title: Terapia Online
    text: |-
      Sesiones por videollamada, facilitando el acceso a la intervención sin necesidad de desplazamiento.
    modal_content: |-
      La terapia online se realiza mediante videollamada, lo que permite mantener el proceso terapéutico sin tener que desplazarse a la consulta.

      Antes de empezar se comprobará la disponibilidad de los medios necesarios y se organizará un espacio adecuado para favorecer la confidencialidad y la concentración.

      - Evita desplazamientos y facilita el acceso para quien tenga horarios limitados o dificultad para desplazarse.
      - Ofrece mayor flexibilidad para organizar las sesiones.
      - Permite mantener la continuidad de la intervención desde un lugar cómodo.

      El acompañamiento y los objetivos del plan de intervención se adaptan a esta modalidad, manteniendo un contacto directo y personalizado.
  - icon: house
    title: A Domicilio
    text: |-
      Intervención en tu entorno cotidiano, ideal para pacientes con movilidad reducida o dificultades específicas.
    modal_content: |-
      La atención a domicilio realiza la intervención en el lugar donde vives, siempre que esta modalidad sea adecuada para tu situación y exista un espacio suficiente para trabajar con comodidad.

      Este formato permite conocer mejor el contexto cotidiano y las rutinas de la persona, para adaptar la intervención a sus necesidades reales.

      - Evita desplazamientos y permite realizar la sesión en casa.
      - Permite conocer mejor las rutinas y las estrategias que necesitarás en tu día a día.
      - Facilita la intervención cuando existen dificultades de movilidad o para desplazarse.

      La idoneidad de esta modalidad y las condiciones del espacio se valoran previamente para acordar el plan de trabajo más adecuado.