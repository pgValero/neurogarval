heading: Modalidades de atención
lead: |-
  Elegir el entorno adecuado para tus sesiones es importante: facilita el trabajo terapéutico y tu comodidad durante el proceso.
# Texto del enlace de cada tarjeta.
more_label: Más información
# Cada modalidad conserva sus datos de tarjeta, su contenido Markdown y las
# fotos opcionales del modal.
items:
  - icon: building
    title: Atención en Clínica
    text: |-
      En consulta presencial, en un entorno profesional y tranquilo, pensado para que puedas sentirte cómodo/a durante las sesiones.
    modal_content: |-
      La atención en clínica se realiza de forma presencial, en un entorno profesional y tranquilo pensado para que puedas sentirte cómodo/a durante las sesiones.

      Este formato dispone de un espacio adecuado para la evaluación y las sesiones, con la presencia de la profesional durante todo el proceso.

      - Realizar evaluaciones neuropsicológicas con las pruebas necesarias.
      - Trabajar las dificultades del día a día en un entorno adecuado.
      - Compartir con la persona y, cuando corresponda, con su familia las orientaciones del plan de intervención.

      El ambiente de consulta está pensado para recibirte con calma, cuidar tu privacidad y favorecer un trabajo cercano y personalizado.
    images:
      # Sube las fotos de la consulta desde el CMS (media/).
      # Mientras "image" esté vacío se muestra el icono de cámara de reserva.
