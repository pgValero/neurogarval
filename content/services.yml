heading: ¿En qué puedo ayudarte?
lead: Trabajo en el ámbito de la neuropsicología y la psicología sanitaria,
  teniendo en cuenta las necesidades y el momento vital de cada persona.
more_label: Más información
items:
  - id: neuro-infantil
    icon: brain
    title: Neuropsicología infantil y juvenil
    card_text: Desarrollo cognitivo, aprendizaje y dificultades que pueden influir
      en el día a día.
    modal_content: >-
      La neuropsicología infantil y juvenil permite evaluar el desarrollo de las
      capacidades cognitivas y conocer cómo pueden influir en el aprendizaje, la
      conducta y el funcionamiento cotidiano. La valoración tiene en cuenta
      tanto las dificultades como las fortalezas de cada niño o adolescente.


      La atención puede dirigirse a:


      - Trastornos del neurodesarrollo, como el Trastorno por Déficit de
      Atención e Hiperactividad (TDAH) y el Trastorno del Espectro Autista
      (TEA).

      - Dificultades de aprendizaje, como problemas en lectura, escritura o
      matemáticas.

      - Dificultades de atención, memoria y funciones ejecutivas, como la
      planificación, la organización o el control de la conducta.

      - Otras dificultades cognitivas que puedan estar interfiriendo en el
      rendimiento académico o en la vida cotidiana.


      En función de las necesidades de cada caso, se pueden realizar
      evaluaciones neuropsicológicas, intervención y estimulación cognitiva.
      También se ofrece orientación a las familias para favorecer la comprensión
      de las dificultades y facilitar estrategias que puedan aplicarse en el
      entorno familiar y escolar.
  - id: neuro-adultos
    icon: brain
    title: Neuropsicología en adultos
    card_text: Atención, memoria y otras funciones cognitivas, incluido el daño
      cerebral adquirido.
    modal_content: >-
      La neuropsicología en adultos permite evaluar las capacidades cognitivas y
      estudiar cómo los cambios en su funcionamiento pueden afectar a la
      autonomía, el trabajo, las relaciones y otras actividades de la vida
      cotidiana.


      La atención puede dirigirse a:


      - Trastorno por Déficit de Atención e Hiperactividad (TDAH) en adultos.

      - Dificultades de atención, memoria y funciones ejecutivas.

      - Daño cerebral adquirido, como el que puede producirse tras un ictus o un
      traumatismo craneoencefálico.

      - Enfermedades neurológicas que puedan afectar al funcionamiento
      cognitivo.

      - Cambios cognitivos asociados a distintas condiciones médicas o
      neurológicas.


      La evaluación neuropsicológica permite identificar las capacidades
      preservadas y aquellas que presentan dificultades, ayudando a orientar la
      intervención.


      En los casos de daño cerebral adquirido, la intervención puede incluir
      rehabilitación neuropsicológica, estimulación cognitiva y estrategias de
      compensación. Los objetivos se establecen teniendo en cuenta el perfil
      cognitivo, las necesidades y las actividades cotidianas de cada persona,
      con el propósito de favorecer su autonomía y participación en la vida
      diaria.
  - id: neuro-mayores
    icon: brain
    title: Neuropsicología en adultos mayores
    card_text: Memoria, cambios cognitivos y estimulación de las capacidades cognitivas.
    modal_content: >-
      La neuropsicología también permite valorar los cambios cognitivos que
      pueden aparecer con el envejecimiento y diferenciar las dificultades
      propias de la edad de aquellas que pueden estar relacionadas con un
      deterioro cognitivo.


      La atención puede dirigirse a:


      - Quejas de memoria.

      - Dificultades de atención u otras funciones cognitivas.

      - Deterioro cognitivo.

      - Demencias.

      - Enfermedades neurodegenerativas.

      - Dificultades en otras funciones cognitivas que puedan afectar al
      funcionamiento cotidiano.


      Además de la evaluación, se pueden realizar programas de estimulación
      cognitiva y ofrecer orientación a familiares y cuidadores cuando sea
      necesario.
  - id: psico
    icon: heart
    title: Psicología Sanitaria
    card_text: Atención a las dificultades emocionales y conductuales en distintas
      etapas de la vida.
    modal_content: >-
      La Psicología Sanitaria se centra en la atención a dificultades
      emocionales y conductuales que pueden aparecer a lo largo de diferentes
      etapas de la vida.


      Puede ser un espacio para trabajar aspectos como:


      - Ansiedad y estrés.

      - Dificultades en la regulación emocional.

      - Estado de ánimo.

      - Autoestima.

      - Adaptación a cambios o situaciones vitales.

      - Dificultades conductuales.


      La intervención se plantea teniendo en cuenta las circunstancias y
      necesidades de cada persona, buscando desarrollar recursos y estrategias
      que puedan resultar útiles en su día a día.
