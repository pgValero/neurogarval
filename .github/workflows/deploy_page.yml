# Build and deployment of the static site on GitHub Pages.
#
# It runs in TWO ways:
#  - push to main: automatic. This is the normal production path: when the
#    develop -> main PR is merged (created by the Pages CMS "Publish changes"
#    button, see .github/workflows/create_pr.yml), main receives the push and
#    this workflow does "build + deploy", publishing _site/.
#  - workflow_dispatch: the "Run workflow" button on GitHub (manual fallback to
#    redeploy without content changes; the CMS button already uses
#    create_pr.yml).
# It always deploys from main: if it is launched by hand from another branch,
# the deploy job is skipped (if: github.ref == 'refs/heads/main') and only the
# build runs.
#
# REQUIREMENT (one-off, manual): in the repository's Settings -> Pages, change
# the source to "GitHub Actions".
name: Deploy Page

on:
  push:
    branches: [main] # automatic deployment when the develop -> main PR is merged
  workflow_dispatch: # manual fallback: "Run workflow" on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; if another manual one starts, the previous one
# is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build_validation.yml
    with:
      # The build leaves _site/ as the Pages artifact for the deploy job below
      # to pick up.
      upload_artifact: true
    secrets: inherit

  deploy:
    # Only deploys from main: a manual dispatch from a different branch builds
    # and validates, but does not publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact (_site)
        uses: actions/download-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
