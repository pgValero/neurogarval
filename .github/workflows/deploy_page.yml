# Build and deployment of the static site on GitHub Pages.
#
# It runs ONLY via workflow_dispatch:
#  - the Pages CMS "Publicar cambios" button (.pages.yml -> actions -> publish)
#    triggers it on main;
#  - the "Run workflow" button on GitHub is the manual fallback (same effect).
#
# Content commits pushed by Pages CMS land directly on main and trigger
# nothing: the site is only rebuilt and published when this workflow runs.
# The build job builds the site with build.py and validates it with prek; only
# if it passes does the deploy job publish _site/ to GitHub Pages (otherwise
# the live site keeps serving the previous version).
# It only deploys from main: a manual dispatch from another branch builds and
# validates, but does not publish.
#
# REQUIREMENT (one-off, manual): in the repository's Settings -> Pages, change
# the source to "GitHub Actions".
name: Deploy Page

on:
  workflow_dispatch: # Pages CMS "Publicar cambios" button (.pages.yml -> actions) + manual "Run workflow"
    inputs:
      payload:
        description: Pages CMS payload as JSON (the CMS always sends it when the button is pressed; this workflow does not use it)
        required: false
        type: string

# Least privilege: reading the repository; the deploy job adds the two
# permissions it needs (pages and id-token) at job level.
permissions:
  contents: read

# Only one deployment at a time; if another one starts, the previous one
# is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned to a commit SHA (zizmor, see .pre-commit/); the
        # comment is the version, for the humans.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml markdown pillow prek

      - name: Build site (scripts/build.py)
        run: python scripts/build.py

      - name: Validate generated _site (prek)
        run: |
          # prek only lints files tracked by git and _site/ is in .gitignore;
          # _site is staged so the validation covers everything generated by
          # build.py (HTML, CSS, JS and URLs).
          git add -f _site
          prek run --config .pre-commit/.pre-commit-config.yaml --all-files

      - name: Upload Pages artifact (_site)
        # This is what the deploy job below picks up. The artifact uploaded
        # with actions/upload-pages-artifact has the name "github-pages".
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    # Only deploys from main: a manual dispatch from a different branch builds
    # and validates, but does not publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # The deployment is the only job that publishes: it needs to write the
    # Pages and to get the OIDC token to authenticate.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # deploy-pages fetches the "github-pages" artifact uploaded by the
        # build job on its own; no download-artifact step is needed.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
