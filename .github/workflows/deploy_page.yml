# Build and deployment of the static site on GitHub Pages.
#
# It runs in TWO ways:
#  - push to main: automatic. This is the normal production path: when the
#    develop -> main PR is merged (created by the Pages CMS "Publish changes"
#    button, see .github/workflows/create_pr.yml), main receives the push and
#    this workflow does "build + deploy", publishing _site/.
#  - workflow_dispatch: the "Run workflow" button on GitHub (manual fallback to
#    redeploy without content changes; the CMS button already uses
#    create_pr.yml).
# It always deploys from main: if it is launched by hand from another branch,
# the deploy job is skipped (if: github.ref == 'refs/heads/main') and only the
# build runs.
#
# REQUIREMENT (one-off, manual): in the repository's Settings -> Pages, change
# the source to "GitHub Actions".
name: Deploy Page

on:
  push:
    branches:
      - 'main' # automatic deployment when the develop -> main PR is merged
  workflow_dispatch: # manual fallback: "Run workflow" on GitHub

# Least privilege: reading the repository; the deploy job adds the two
# permissions it needs (pages and id-token) at job level.
permissions:
  contents: read

# Only one deployment at a time; if another manual one starts, the previous one
# is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # $/ is the recommended syntax to call a reusable workflow of the same
    # repository (it always uses the same commit as this one).
    uses: $/.github/workflows/build_validation.yml
    with:
      # The build leaves _site/ as the Pages artifact for the deploy job below
      # to pick up.
      upload_artifact: true

  deploy:
    # Only deploys from main: a manual dispatch from a different branch builds
    # and validates, but does not publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # The deployment is the only job that publishes: it needs to write the
    # Pages and to get the OIDC token to authenticate.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact (_site)
        # The artifact that build_validation.yml uploads with
        # actions/upload-pages-artifact has the name "github-pages".
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
