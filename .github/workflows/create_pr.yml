# Pages CMS "Publish changes" button (.pages.yml -> actions -> publish).
#
# Publishing flow (see AGENTS.md):
#  1. Pages CMS is used on the develop branch (editors save there).
#  2. When the button is pressed, this workflow is launched with
#     workflow_dispatch on develop and orchestrates the publishing:
#       - if develop is up to date with main, it does nothing;
#       - it creates (or reuses) the develop -> main PR;
#       - it marks it for AUTO-MERGE with rebase: GitHub merges it as soon as
#         the required checks of the main branch protection pass.
#  3. The merge into main then triggers .github/workflows/deploy_page.yml (push
#     to main), which builds the site and publishes it on GitHub Pages.
#
# It only has an effect if the button is pressed from develop; from any other
# branch the job is skipped (the CMS button is only used on develop).
#
# REQUIREMENTS (one-off, manual, see steps in AGENTS.md):
#  - Settings -> General: "Allow auto-merge" enabled and "Rebase and merging"
#    allowed (GH merges with rebase once the checks pass).
#  - Branch protection on main: "Require a pull request before merging" and the
#    "Build Validation / build-validation" status check as required.
name: Create PR

on:
  workflow_dispatch: # "Publish changes" button of Pages CMS (.pages.yml -> actions)
    inputs:
      payload:
        description: Pages CMS payload as JSON (the CMS always sends it when the button is pressed; this workflow does not use it)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/develop' # the button only publishes from develop
    env:
      GH_TOKEN: ${{ github.token }} # gh needs the token explicitly in the environment
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] the credentials are needed on purpose: the
        # script below fetches from origin.
        # Pinned to a commit SHA (zizmor, see .pre-commit/); the comment is
        # the version, for the humans.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Create develop -> main PR and mark it for rebase auto-merge
        run: |
          set -euo pipefail

          git fetch origin main --depth 1
          git fetch origin develop --depth 1

          # 1) Nothing to publish if develop is up to date with main.
          if git diff --quiet origin/main origin/develop; then
            echo "::notice::develop is up to date with main: there are no changes to publish."
            exit 0
          fi

          # 2) Reuse the open PR if it already exists; otherwise create it.
          PR_NUMBER="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "Publish changes to the website" \
              --body "Changes saved from Pages CMS (develop branch). It is merged with rebase automatically as soon as the checks pass. After the merge, the deployment publishes itself."
            PR_NUMBER="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          fi
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          echo "PR: $PR_URL"

          # 3) Auto-merge with rebase: GitHub merges it when the checks pass.
          gh pr merge "$PR_URL" --auto --rebase
          echo "::notice::PR $PR_URL marked for rebase auto-merge when the checks pass."
