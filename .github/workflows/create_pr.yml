# Botón "Publicar cambios" de Pages CMS (.pages.yml -> actions -> publicar).
#
# Flujo de publicación (ver AGENTS.md):
#  1. Pages CMS se usa sobre la rama develop (los editores guardan ahí).
#  2. Al pulsar el botón, este workflow se lanza con workflow_dispatch sobre
#     develop y orquesta la publicación:
#       - si develop está al día con main, no hace nada;
#       - crea (o reutiliza) la PR develop -> main;
#       - la marca para AUTO-MERGE con rebase: GitHub la mergea sola en cuanto
#         pasen los checks obligatorios de la protección de rama de main.
#  3. El merge en main dispara después .github/workflows/deploy_page.yml (push
#     a main), que construye el sitio y lo publica en GitHub Pages.
#
# Solo tiene efecto si el botón se pulsa desde develop; desde cualquier otra
# rama el trabajo se omite (el botón del CMS solo se usa sobre develop).
#
# REQUISITOS (una sola vez, manual, ver pasos en AGENTS.md):
#  - Settings -> General: "Allow auto-merge" activado y "Rebase and merging"
#    permitido (GH mergea con rebase cuando pasen los checks).
#  - Protección de rama en main: "Require a pull request before merging" y el
#    status check "Build Validation / build-validation" como obligatorio.
name: Create PR

on:
  workflow_dispatch: # botón "Publicar cambios" de Pages CMS (.pages.yml -> actions)
    inputs:
      payload:
        description: Pages CMS payload as JSON (lo envía siempre el CMS al lanzar el botón; este workflow no lo usa)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/develop' # el botón solo publica desde develop
    env:
      GH_TOKEN: ${{ github.token }} # gh necesita el token explícito en el entorno
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear PR develop -> main y marcar auto-merge con rebase
        run: |
          set -euo pipefail

          git fetch origin main --depth 1
          git fetch origin develop --depth 1

          # 1) Nada que publicar si develop está al día con main.
          if git diff --quiet origin/main origin/develop; then
            echo "::notice::develop está al día con main: no hay cambios que publicar."
            exit 0
          fi

          # 2) Reutilizar la PR abierta si ya existe; si no, crearla.
          PR_NUMBER="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "Publicar cambios en la web" \
              --body "Cambios guardados desde Pages CMS (rama develop). Se mergea con rebase automáticamente en cuanto pasen los checks. Tras el merge, el despliegue se publica solo."
            PR_NUMBER="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          fi
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          echo "PR: $PR_URL"

          # 3) Auto-merge con rebase: GitHub la mergea cuando pasen los checks.
          gh pr merge "$PR_URL" --auto --rebase
          echo "::notice::PR $PR_URL marcada para auto-merge con rebase cuando pasen los checks."