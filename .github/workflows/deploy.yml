# Build y despliegue del sitio estático en GitHub Pages.
#
# El workflow NO se ejecuta automáticamente con cada commit: solo se lanza
# a mano, bien desde el botón "Publicar cambios" de Pages CMS (.pages.yml ->
# actions), bien desde el botón "Run workflow" de la interfaz de GitHub.
# En ambos casos el disparador es workflow_dispatch.
# La plataforma de despliegue sigue siendo GitHub Pages y las ramas no
# cambian: lanzándolo desde main hace "build + deploy" y publica _site/.
#
# REQUISITO (una sola vez, manual): en Settings -> Pages del repositorio,
# cambiar la fuente a "GitHub Actions".
name: Deploy

on:
  workflow_dispatch: # botón "Publicar cambios" de Pages CMS (.pages.yml -> actions) o "Run workflow" en GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si se lanza otro manual, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml markdown prek

      - name: Construir sitio (build.py)
        run: python build.py

      - name: Validar _site generado (prek run --all-files)
        run: |
          # prek --all-files solo lintea ficheros rastreados por git y _site/
          # está en .gitignore; se indexa _site para que la validación cubra
          # todo lo generado por build.py (HTML, CSS, JS y URLs).
          git add -f _site
          prek run --all-files

      - name: Subir artefacto (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Solo se despliega desde main: un dispatch manual lanzado desde una
    # rama distinta construye y valida, pero no publica.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
