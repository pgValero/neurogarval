# Build y despliegue del sitio estático en GitHub Pages.
#
# Se lanza de DOS formas:
#  - push a main: automático. Es el camino normal de producción: al mergear
#    la PR develop -> main (creada por el botón "Publicar cambios" de Pages
#    CMS, ver .github/workflows/publicar.yml), main recibe el push y este
#    workflow hace "build + deploy" publicando _site/.
#  - workflow_dispatch: botón "Run workflow" en GitHub (fallback manual para
#    re-desplegar sin cambios de contenido; el botón del CMS ya usa publicar).
# Se despliega siempre desde main: si se lanza a mano desde otra rama, el job
# deploy se omite (if: github.ref == 'refs/heads/main') y solo se construye.
#
# REQUISITO (una sola vez, manual): en Settings -> Pages del repositorio,
# cambiar la fuente a "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main] # despliegue automático al mergear la PR develop -> main
  workflow_dispatch: # fallback manual: "Run workflow" en GitHub
    inputs:
      payload:
        description: Pages CMS payload as JSON (requerido por el botón del CMS si algún día se vuelve a apuntar aquí; se deja opcional para no estorbar al lanzarlo a mano)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si se lanza otro manual, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml markdown prek

      - name: Construir sitio (build.py)
        run: python build.py

      - name: Validar _site generado (prek run --all-files)
        run: |
          # prek --all-files solo lintea ficheros rastreados por git y _site/
          # está en .gitignore; se indexa _site para que la validación cubra
          # todo lo generado por build.py (HTML, CSS, JS y URLs).
          git add -f _site
          prek run --all-files

      - name: Subir artefacto (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Solo se despliega desde main: un dispatch manual lanzado desde una
    # rama distinta construye y valida, pero no publica.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
