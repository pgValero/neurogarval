# Reusable workflow: site build + validation.
#
# It runs on EVERY pull request against main: it builds the site with build.py
# and validates it with prek, exactly like the deploy. Its result is the status
# check "Build Validation / build-validation" that the main branch protection
# requires: if it fails, the PR is not merged (and auto-merge does not touch
# it).
#
# deploy_page.yml also calls it (on push to main) with upload_artifact: true:
# there it validates and also uploads _site/ as the Pages artifact for the
# deploy job to pick up. On PRs the upload step is skipped.
#
# REQUIREMENT (one-off, manual): in Settings -> Branches -> main rule, check
# "Require status checks to pass before merging" and add the check
# "Build Validation / build-validation".

name: Build Validation

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: Upload _site/ as the Pages artifact (only deploy_page.yml asks for it; on PRs it is not needed and nothing is uploaded)
        type: boolean
        default: false
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned to a commit SHA (zizmor, see .pre-commit/); the
        # comment is the version, for the humans.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml markdown pillow prek

      - name: Build site (scripts/build.py)
        run: python scripts/build.py

      - name: Validate generated _site (prek)
        run: |
          # prek only lints files tracked by git and _site/ is in .gitignore;
          # _site is staged so the validation covers everything generated by
          # build.py (HTML, CSS, JS and URLs).
          git add -f _site
          prek run --config .pre-commit/.pre-commit-config.yaml --all-files

      - name: Upload Pages artifact (_site)
        # Only on deploy: this is what the deploy job of deploy_page.yml picks
        # up. On PRs the input is not defined, so the step is skipped and no
        # artifact is uploaded.
        if: inputs.upload_artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
