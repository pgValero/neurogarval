# Configuración de hooks para usar con prek (compatible también con pre-commit).
# Instalar los hooks:   prek install --config .pre-commit/.pre-commit-config.yaml
# Ejecutar a mano:      prek run --config .pre-commit/.pre-commit-config.yaml --all-files
repos:
  # Hooks locales: HTML, CSS, JavaScript y enlaces
  - repo: local
    hooks:
      # 1) Linter de HTML
      - id: htmlhint
        name: HTMLHint (HTML)
        language: node
        entry: htmlhint
        files: \.html?$
        additional_dependencies: [htmlhint]
        args:
          - --rules
          - tag-pair,tagname-lowercase,attr-no-duplication,attr-value-double-quotes,id-unique

      # 2) Linter de CSS (lee .pre-commit/.stylelintrc.json)
      - id: stylelint
        name: Stylelint (CSS)
        language: node
        entry: stylelint
        files: \.css$
        additional_dependencies: [stylelint]
        args:
          - --config
          - .pre-commit/.stylelintrc.json

      # 3) Linter de JavaScript (lee .pre-commit/eslint.config.js)
      - id: eslint
        name: ESLint (JavaScript)
        language: node
        entry: eslint
        files: \.m?js$
        additional_dependencies: [eslint]
        args:
          - --config
          - .pre-commit/eslint.config.js

      # 4) Validador multiplataforma de URLs rotas (HTML, enlaces locales y externos)
      - id: lychee
        name: Lychee (URLs rotas)
        language: python
        entry: lychee
        additional_dependencies: [lychee-bin==0.24.2]
        files: \.html?$
        args:
          - --no-progress
          - "--exclude=^tel:"
          # Las plantillas de src/ usan rutas relativas al HTML publicado;
          # esos ficheros se comprueban en el _site generado, no junto a src/.
          - "--exclude=file:///.*/src/(aviso_legal\\.pdf|favicon\\.svg|logo\\.svg|media/)"
          # URLs absolutas a media/ aún no publicadas (retirar tras el 1er despliegue):
          - "--exclude=https?://[^/]+/media/"
          # Marcadores __archivo.campo__ que build.py sustituye por contenido real:
          - "--exclude=__[a-z0-9_.]+__"
